name: Update Cask

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cask
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Update Cask
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="${RUNNER_TEMP}/rufin-release.json"
          curl \
            --fail-with-body \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --location \
            --retry 3 \
            --show-error \
            --silent \
            https://api.github.com/repos/screwys/Rufin/releases/latest \
            > "${release_json}"
          version="$(script/update-cask "${release_json}")"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate Cask
        run: |
          brew style --cask Casks/rufin.rb
          brew audit --cask --strict --arch=all --os=macos Casks/rufin.rb

      - name: Commit Cask
        env:
          VERSION: ${{ steps.update.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/rufin.rb; then
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Casks/rufin.rb
          git commit -m "chore: update Rufin to ${VERSION}"
          git push origin HEAD:main
